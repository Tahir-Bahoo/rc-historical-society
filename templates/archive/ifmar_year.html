{% extends 'archive/base.html' %}
{% block content %}
<header class="main"><h1>IFMAR {{ year }}</h1></header>
{% for event in events %}
<h3>{{ event.class_name }}</h3>
<p>{{ event.results_data|linebreaksbr }}</p>
<hr class="major" />
{% empty %}
<p>No results are available for this year yet.</p>
{% endfor %}
{% endblock %}
