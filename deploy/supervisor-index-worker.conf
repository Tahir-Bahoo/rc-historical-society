# Supervisor program: PDF search indexer (separate from Gunicorn).
# Install on the EC2 host:
#   sudo cp deploy/supervisor-index-worker.conf /etc/supervisor/conf.d/rchs-index.conf
#   sudo supervisorctl reread && sudo supervisorctl update
# Adjust paths/user if your layout differs.

[program:rchs-index]
command=/home/ubuntu/rc-historical-society/env/bin/python manage.py process_index_queue --loop --sleep 15
directory=/home/ubuntu/rc-historical-society
user=ubuntu
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/logs/rchs-index.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=DJANGO_SETTINGS_MODULE="config.settings"
# Note: config/settings.py and search_service load .env via python-dotenv.
# Ensure POSTGRES_* / DJANGO_ALLOWED_HOSTS are set in ~/rc-historical-society/.env
