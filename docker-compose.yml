services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: deploy/Dockerfile.django
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mediadata:/app/django_project/media
      - staticdata:/app/django_project/staticfiles
      # Mount legacy PDFs read-only so the indexer + static handler can reach them
      - ./:/legacy_site:ro
    expose:
      - "8000"

  search:
    build:
      context: .
      dockerfile: deploy/Dockerfile.search
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8001"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - django
      - search
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticdata:/srv/static:ro
      - mediadata:/srv/media:ro

volumes:
  pgdata:
  mediadata:
  staticdata:
